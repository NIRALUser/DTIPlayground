#
#   Build the documentation and publish it to GitHub Pages.
#
#   The same Sphinx sources as readthedocs (docs/, with the module pages generated from the module definitions by
#   docs/ext/module_docs.py), built here as well so that publishing doesn't depend on a service outside the
#   repository, and so that a documentation error shows up as a failed check on the commit that caused it.
#
#   The repository has to allow it once: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#   The result is served at https://niraluser.github.io/DTIPlayground/
#
name: Documentation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

## a queued run replaces a waiting one, but never interrupts a deployment in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Sphinx
        run: |
          python -m pip install --upgrade pip
          python -m pip install sphinx -r docs/requirements.txt

      - name: Build the documentation
        ## -W: a warning fails the build, so a broken reference or a malformed page is caught here
        run: python -m sphinx -b html -W --keep-going docs _site

      - name: Check that the generated module pages are there
        run: |
          test -f _site/modules/index.html
          test -f _site/modules/dmriprep.html
          test -f _site/modules/dmrifiberprofile.html
          echo "$(find _site/modules -name '*.html' | wc -l) module pages built"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
