## Usage (from this directory):
##   docker compose up dtiplayground        # released dtiplayground from the image, http://localhost:6543
##   docker compose up dtiplayground-dev    # runs the source tree of this repository (mounted at /work)
## Set DOCKER_UID/DOCKER_GID to your ids so output files are owned by you:
##   DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) docker compose up ...
## Data under $HOME is visible in the container at the same path; configuration and tools are kept in $HOME/.niral-dti.
## The first start asks whether to install FSL and DTIPlaygroundTools. Answer interactively with
##   docker compose run --rm --service-ports dtiplayground
## or mount an existing FSL installation (add e.g. /path/to/fsl:/path/to/fsl:ro under volumes).

services:

  dtiplayground:
    container_name: dtiplayground
    image: niraluser/dtiplayground
    build:
      context: .
      dockerfile: Dockerfile
    user: ${DOCKER_UID:-1000}:${DOCKER_GID:-1000}
    stdin_open: true
    tty: true
    working_dir: ${HOME}
    ports:
      - 6543:6543
    volumes:
      - /etc/group:/etc/group:ro
      - /etc/passwd:/etc/passwd:ro
      - ${HOME}:${HOME}
    environment:
      - HOME=${HOME}
      - TZ=America/New_York

  dtiplayground-dev:
    container_name: dtiplayground-dev
    image: niraluser/dtiplayground
    build:
      context: .
      dockerfile: Dockerfile
    user: ${DOCKER_UID:-1000}:${DOCKER_GID:-1000}
    stdin_open: true
    tty: true
    working_dir: /work
    ports:
      - 6543:6543
    volumes:
      - /etc/group:/etc/group:ro
      - /etc/passwd:/etc/passwd:ro
      - ../:/work
      - ${HOME}:${HOME}
    environment:
      - HOME=${HOME}
      - PYTHONPATH=/work
      - TZ=America/New_York
    entrypoint: ["python3", "/work/bin/dmriplayground.py"]
    command: ["serve", "--host", "0.0.0.0", "-p", "6543", "--debug"]
