name: EXTRACT_Profile
caption: EXTRACT_Profile
description: Extract fiber tract statistics from images
version: "0.1"
dependency: []
module_type: fiberprofile
process_attributes:
    - utility
result: null
protocol: #define protocol parameters here
    atlas: # Not used directly. Added to beginning of each tract file path
        type: dirpath-remote
        caption: Atlas directory
        default_value: null
        description: Directory containing set of fiber tracts in the atlas to be analyzed
    tracts:
        type: filepath-remote-mult
        caption: Comma delimited list of file names of tracts in atlas directory
        default_value: null
        description: Selected set of tracts to use. Must uniquely map to a VTK fiber file in the atlas location.
    inputIsDTI:
        type: boolean
        caption: Input is DTI
        default_value: true
        description: "Input image is a DTI (column 'Original DTI Image'). The tensors are interpolated along the fibers and FA, MD, AD, RD are computed from them; <prefix>FA, <prefix>MD, <prefix>AD, <prefix>RD are computed from the tensors of the column '<prefix> DTI Image' if the column map has that key (e.g. FWFA from 'FW DTI Image'). Other properties, or all properties if this is off, are sampled from their own scalar image column. A property whose image cell is empty for a subject is not profiled for that subject."
    tensorInterpolation:
        type: list
        caption: Tensor interpolation
        candidates:
            - value: logEuclidean
              caption: Log-Euclidean
              description: Linear interpolation of the matrix logarithms of the tensors (no swelling effect). Voxels without a positive definite tensor are left out.
            - value: linear
              caption: Linear
              description: Linear interpolation of the tensor components (as fiberprocess)
        default_value: logEuclidean
        description: Interpolation of the DTI along the fibers (only if the input is a DTI)
    propertiesToProfile: # tensor related properties (e.g. FA, MD, etc.) require an input DTI volume
        type: string
        caption: Properties to profile
        default_value: FA, MD, RD, AD
        description: List of selected properties to profile along tracts
    useDisplacementField:
        type: boolean
        caption: Use displacement field to transform image to atlas space
        default_value: true
        description: Convert image to atlas space using displacement field. If set to false, the image will not be transformed to atlas space.
    parameterToColumnHeaderMap: # Optional map of parameters (e.g., scalar names, case id) to column headers
        type: dictionary
        caption: Property to column header map
        default_value:
            Case ID: id
            Original DTI Image: Original DTI image
            Deformation Field: Concatenated Deformation field
            FA: FA from original
            MD: MD from original
            AD: AD from original
            RD: RD from original
        description: "Datasheet column of each parameter: Case ID, Original DTI Image, Deformation Field, '<prefix> DTI Image' (additional tensor images, e.g. FW DTI Image), and the image of each scalar property"
    resultCaseColumnwise:
        type: boolean
        caption: Store cases as columns in result
        default_value: true
        description: In output CSV, store cases as columns instead of rows
    # TODO: Add support for a "per tract origin file" option where a user can specify their origins per tract in a file
    planeOfOrigin:
        type: list
        caption: Type of plane of origin
        candidates:
            - value: Median
              caption: Median
              description: Origin of profile will be median of tract
            - value: CoG
              caption: Center of gravity
              description: Origin of profile will be center of gravity
        default_value: Median
        description: Determines plane that sets the origin of the profile arc length
    arcLength:
        type: list
        caption: Arc length
        candidates:
            - value: stored
              caption: Stored
              description: Use the arc lengths stored in parametrized tracts (point data SamplingDistance2Origin, e.g. written by dmrifiberprofile parametrize-fibers); computed from the plane of origin if the tract has none
            - value: compute
              caption: Compute
              description: Always compute the arc lengths from the plane of origin
        default_value: stored
        description: Source of the arc length of the fiber points
    cleanup:
        type: list
        caption: Cleanup method
        default_value: duringProcessing
        candidates:
            - value: duringProcessing
              caption: During processing
              description: Remove temporary files the moment they're no longer needed
            - value: endOfProcessing
              caption: End of processing
              description: Remove temporary files after processing is complete
            - value: noCleanup
              caption: No cleanup
              description: Do not remove temporary files
        description: Remove temporary files after processing
    stepSize:
        type: float
        caption: Step size
        default_value: 1
        description: Distance (mm) along the tract between profile samples; samples are at multiples of the step size from the plane of origin
    supportBandwidth:
        type: float
        caption: Support/bandwidth
        default_value: 1
        description: Standard deviation (mm) of the Gaussian kernel; points within this distance of a sample are averaged
    noNaN:
        type: boolean
        caption: No NaN
        default_value: false
        description: Remove fibers with NaN values of the profiled property (for each subject)
    writeFiberFiles:
        type: boolean
        caption: Write fiber files
        default_value: false
        description: Write the fibers of each subject with the sampled property values and arc lengths (one VTK file per subject, property and tract, e.g. to view the values along the fibers). Not needed for the profiles; removed by the cleanup like the .fvp profiles
    mask:
        type: file
        caption: Mask
        default_value: null
        description: Optional mask file to use during profile extraction. Mask has to be defined in atlas space.
    maskThreshold:
        type: float
        caption: Mask threshold
        default_value: 0.5
        description: Fibers whose average mask value along the fiber is below this threshold are removed (only used with a mask)

