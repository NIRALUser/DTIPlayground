name: BRAIN_Mask
caption: BRAIN_Mask
description: Brain Masking, mask file will be added to the global variables in the result file
version: "0.1"
dependency: []
result: null
module_type: prep
process_attributes:
    - utility
protocol:
      method: 
        type: list
        caption: Method
        candidates:
          - value: fsl
            caption: FSL
            description: Use FSL for Brainmasking
          - value: synthstrip
            caption: SynthStrip
            description: SynthStrip deep learning brain extraction (built in, torch; FreeSurfer's mri_synthstrip only if asked for or without torch)
          - value: hdbet
            caption: HD-BET
            description: HD-BET deep learning brain extraction of the average b0 (hd-bet command, e.g. installed in a separate Python environment)
          - value: medianOtsu
            caption: Median Otsu
            description: dipy median_otsu, median filter and Otsu threshold of the average b0
          # - value: antspynet
          #   caption: AntsPyNet
          #   description: AntsPyNet's brain_extraction() method
          - value: customMask
            caption: Custom Brain Mask
            description: Use custom Brainmasking
        default_value: fsl
        description: Method to extract the brain 
      averagingMethod:
        type: list
        caption: Average Method
        default_value: idwi
        description: Averaging method by which the source image is generated for the mask
        candidates:
          - value: direct_average
            caption: Direct Average
            description: Direct average on baseline images. If no baseline is found then average whole volume
          - value: idwi
            caption: IDWI
            description: Geometric mean of baseline images. If no baseline is found then whole images will be used.
      n4BiasCorrection:
        type: boolean
        caption: N4 bias field correction
        default_value: false
        description: N4 bias field correction (SimpleITK) of the image the mask is computed from (the average baseline, also the b0 input of SynthStrip), against an intensity inhomogeneity that makes the mask cut into the darker side of the brain; not applied to the AD input of SynthStrip (a diffusivity has no bias field). The corrected image and the field are written to the module folder (mask_input_n4*.nii.gz)
        if : { "method" : "fsl,synthstrip,hdbet,medianOtsu" }
      n4ShrinkFactor:
        type: integer
        caption: N4 shrink factor
        default_value: 4
        description: The bias field is estimated on the image shrunk by this factor (faster, the field being smooth) and applied at full resolution
        if:
            n4BiasCorrection : true
      betFractionalThreshold:
        type: float
        caption: BET Fractional Threshold
        default_value: 0.5
        description: FSL bet fractional intensity threshold (-f, between 0 and 1); smaller values give a larger brain outline, larger values a smaller one
        if : { "method" : "fsl" }
      synthstripInput:
        type: list
        caption: SynthStrip Input
        default_value: ad
        description: Image SynthStrip is applied to
        candidates:
          - value: ad
            caption: AD
            description: Axial diffusivity of a DTI fit of the image (diffusion weighted volumes up to b=1500)
          - value: b0
            caption: Average b0
            description: Average of the baseline (b=0) images
        if : { "method" : "synthstrip" }
      synthstripBorder:
        type: float
        caption: SynthStrip Border
        default_value: 1.0
        description: Mask border threshold in mm (mri_synthstrip -b); larger values give a larger mask
        if : { "method" : "synthstrip" }
      synthstripNoCSF:
        type: boolean
        caption: SynthStrip exclude CSF
        default_value: false
        description: Exclude the CSF from the brain border (mri_synthstrip --no-csf)
        if : { "method" : "synthstrip" }
      synthstripImplementation:
        type: list
        caption: SynthStrip Implementation
        default_value: auto
        description: The built-in SynthStrip (torch; the model weights are downloaded on first use) or FreeSurfer's mri_synthstrip; both give the same masks
        candidates:
          - value: auto
            caption: Auto
            description: The built-in version, or FreeSurfer's mri_synthstrip when torch isn't installed
          - value: freesurfer
            caption: FreeSurfer
            description: FreeSurfer's mri_synthstrip (7.3+), an external program
          - value: builtin
            caption: Built-in
            description: SynthStrip network run in dtiplayground (torch)
        if : { "method" : "synthstrip" }
      synthstripPath:
        type: filepath-remote
        caption: FreeSurfer home or mri_synthstrip
        default_value: ''
        description: FreeSurfer home directory or path of mri_synthstrip (synthstripImplementation freesurfer, or auto without torch); if empty, $FREESURFER_HOME and the PATH are searched
        if : { "method" : "synthstrip" }
      hdbetDevice:
        type: list
        caption: HD-BET Device
        default_value: auto
        description: Device HD-BET runs on
        candidates:
          - value: auto
            caption: Auto
            description: GPU (cuda) if the torch of hd-bet sees one, otherwise CPU
          - value: cuda
            caption: GPU
            description: GPU (cuda)
          - value: cpu
            caption: CPU
            description: CPU
        if : { "method" : "hdbet" }
      hdbetTTA:
        type: boolean
        caption: HD-BET test time augmentation
        default_value: true
        description: Test time augmentation (mirroring); disabling it (--disable_tta) is faster, mainly on CPU, at a slight cost in quality
        if : { "method" : "hdbet" }
      hdbetPath:
        type: filepath-remote
        caption: hd-bet executable or environment
        default_value: ''
        description: Path of the hd-bet command or of the Python environment (or its bin directory) it is installed in; if empty, the environment of dtiplayground and the PATH are searched
        if : { "method" : "hdbet" }
      medianOtsuRadius:
        type: integer
        caption: Median Otsu radius
        default_value: 4
        description: Radius (in voxels) of the median filter applied before the Otsu threshold
        if : { "method" : "medianOtsu" }
      medianOtsuNumpass:
        type: integer
        caption: Median Otsu passes
        default_value: 4
        description: Number of median filter passes
        if : { "method" : "medianOtsu" }
      medianOtsuDilate:
        type: integer
        caption: Median Otsu dilation
        default_value: 0
        description: Number of binary dilation iterations applied to the mask (0 for none)
        if : { "method" : "medianOtsu" }
      modality: ## in case of antspynet
        type: list
        candidates:
          - value: t2
            caption: T2
            description: T2 Modality 
          - value: fa
            caption: FA
            description: Fractional Anistropy
        default_value: t2
        description: Modality of the input image
      customMaskPath: 
        type: filepath-remote
        caption: Custom Brain Mask
        default_value: 
        description: Provide custom mask to override default
        if : { "method" : "customMask" }
