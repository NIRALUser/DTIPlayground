name: SUSCEPTIBILITY_Correction
caption: SUSCEPTIBILITY Correction
description: Susceptibility correction with FSL, 2 phase-encoded images are required to use this module
version: "0.1"
dependency: null 
module_type: prep
process_attributes:
    - deform_image
    - multi_input
result: null
protocol:
      phaseEncodingAxis: 
        type: number
        caption: Phase Encoding Axis Index (0,1,2)
        default_value: 1
        description: Phase encoding axis (list of axis index of phase encoding (0,1,2)),e.g. 0 - rl, 1 - ap(fh), 2  - si 
      phaseEncodingValue: 
        type: float
        caption: Phase Encoding Value 
        default_value: 0.0924
        description: Phase encoding value (real number)
      configurationFilePath: 
        type: filepath-remote
        caption: FSL topup configuration file path 
        default_value: $CONFIG_DIR/parameters/fsl/fsl_regb02b0.cnf 
        description: FSL topup configuration file path 
      stripBaselineOnlyImage: 
        type: boolean
        caption: Strip the baseline-only image
        default_value: true
        description: When only one of the images is a full DWI and the other one was acquired for topup (baselines, and at most one dummy volume that isn't a baseline), remove the volumes of the latter at the end of EDDYMOTION_Correct, which uses them to refine the correction. The result has the full DWI only
